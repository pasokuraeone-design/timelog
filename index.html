<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ポチログ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ポチログ">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232F4858'/%3E%3Ctext x='50' y='66' font-size='50' text-anchor='middle'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAE4D8;
    --paper-card: #F5F1E7;
    --ink: #2B2A26;
    --ink-soft: #726C5E;
    --line: #D2C9B7;
    --drive: #2F4858;
    --drive-soft: #46647A;
    --drive-tint: #DDE5E9;
    --record: #A6672E;
    --record-tint: #F0E1CF;
    --stop: #9B4A3A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 8px; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 900;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .date-nav { display: flex; align-items: center; gap: 10px; }
  .date-nav button {
    background: none; border: none; color: var(--ink-soft);
    font-size: 18px; padding: 4px 6px; cursor: pointer; line-height: 1;
  }
  .date-label { font-size: 13px; color: var(--ink-soft); font-weight: 500; min-width: 92px; text-align: center; }

  .summary { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 18px; }
  .summary b { color: var(--ink); font-weight: 600; }

  .action-btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.08s ease, box-shadow 0.15s ease;
  }
  .action-btn:active { transform: scale(0.97); }

  .drive-btn {
    background: var(--drive);
    color: #F4EFE4;
    font-size: 19px;
    padding: 22px 10px;
    margin-bottom: 12px;
    box-shadow: 0 3px 0 #1E313C;
  }
  .drive-btn.running {
    background: var(--drive-soft);
    box-shadow: 0 3px 0 #2C4552;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 3px 0 #2C4552; }
    50% { box-shadow: 0 3px 0 #2C4552, 0 0 0 5px rgba(70,100,122,0.18); }
  }
  .drive-btn .timer { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 15px; opacity: 0.9; }

  .record-btn {
    background: var(--record-tint);
    color: var(--record);
    font-size: 16px;
    padding: 15px 10px;
    margin-bottom: 22px;
    border: 1.5px solid #DDBD97;
  }

  .log-title { font-size: 13px; color: var(--ink-soft); font-weight: 600; margin: 0 0 10px 2px; }

  .entry {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .entry .time {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    min-width: 44px;
    padding-top: 1px;
  }
  .entry .icon {
    font-size: 16px;
    min-width: 20px;
    text-align: center;
    padding-top: 1px;
  }
  .entry .body { flex: 1; min-width: 0; }
  .entry .main-text { font-size: 14.5px; line-height: 1.5; word-break: break-word; }
  .entry .sub-text { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .entry.drive .main-text { color: var(--drive); font-weight: 600; }
  .entry .del {
    background: none; border: none; color: #C4BBA5; font-size: 13px;
    cursor: pointer; padding: 2px 4px; align-self: center;
  }

  .empty {
    text-align: center; color: var(--ink-soft); font-size: 13.5px;
    padding: 30px 10px; line-height: 1.7;
  }

  /* modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(43,42,38,0.42);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.18s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--paper); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 22px 18px 26px;
    transform: translateY(16px); transition: transform 0.2s ease;
  }
  .overlay.open .sheet { transform: translateY(0); }
  .sheet h2 {
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 18px; margin: 0 0 4px;
  }
  .sheet .sheet-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 16px; }
  .sheet textarea, .sheet input[type=text] {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 12px; font-size: 15px; font-family: inherit;
    background: #fff; color: var(--ink); resize: none;
  }
  .sheet textarea:focus, .sheet input:focus { outline: 2px solid var(--drive-soft); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .chip {
    background: var(--paper-card); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 13px; font-size: 13px;
    color: var(--ink-soft); cursor: pointer;
  }
  .chip:active { background: var(--record-tint); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
  .sheet-actions button {
    flex: 1; border: none; border-radius: 10px; padding: 13px 10px;
    font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-cancel { background: none; color: var(--ink-soft); border: 1.5px solid var(--line) !important; }
  .btn-save { background: var(--drive); color: #F4EFE4; }
  .sheet.record-mode .btn-save { background: var(--record); }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-size: 13px;
    padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  #statsBtn { background: none; border: none; font-size: 19px; cursor: pointer; color: var(--ink-soft); padding: 4px; }
  .stats-sheet { max-height: 82vh; overflow-y: auto; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 4px; }
  .stat-card { background: var(--paper-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px; }
  .stat-card .num { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; font-size: 22px; color: var(--drive); }
  .stat-card .label { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .streak-line { font-size: 13px; color: var(--record); font-weight: 600; margin: 6px 0 16px; text-align: center; min-height: 18px; }
  .bar-title { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin: 16px 0 10px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-fill { width: 100%; background: var(--drive-soft); border-radius: 4px 4px 0 0; min-height: 3px; }
  .bar-fill.today { background: var(--record); }
  .bar-label { font-size: 9.5px; color: var(--ink-soft); margin-top: 4px; }
  .purpose-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  .purpose-row .cnt { color: var(--ink-soft); }

  .header-right { display: flex; align-items: center; gap: 6px; }
  .sync { font-size: 11px; color: var(--ink-soft); }
  .migrate-box {
    background: var(--drive-tint); border: 1px solid #BFCDD5; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.6;
  }
  .migrate-box .btns { display: flex; gap: 8px; margin-top: 10px; }
  .migrate-box button {
    flex: 1; border: none; border-radius: 9px; padding: 10px 6px;
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .migrate-box .btn-backup { background: #fff; color: var(--drive); border: 1px solid #BFCDD5; }
  .migrate-box .btn-migrate { background: var(--drive); color: #F4EFE4; }
  .small-link {
    background: none; border: none; color: var(--ink-soft); font-size: 12px;
    text-decoration: underline; cursor: pointer; padding: 6px 0; font-family: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ポチログ</h1>
    <div class="header-right">
      <span class="sync" id="syncStatus"></span>
      <button id="statsBtn" aria-label="振り返り">📊</button>
    </div>
  </header>
  <div class="date-nav" style="margin-bottom:2px;">
    <button id="prevDay">‹</button>
    <span class="date-label" id="dateLabel">-</span>
    <button id="nextDay">›</button>
  </div>
  <div class="summary" id="summary"></div>

  <button class="action-btn drive-btn" id="driveBtn">
    <span id="driveBtnLabel">🚗 出発する</span>
  </button>
  <button class="action-btn record-btn" id="recordBtn">＋ きろくする</button>

  <div class="migrate-box" id="migrateBox" style="display:none;">
    <div id="migrateText"></div>
    <div class="btns">
      <button class="btn-backup" id="backupBtn">💾 バックアップ保存</button>
      <button class="btn-migrate" id="migrateBtn">☁ クラウドに移す</button>
    </div>
  </div>

  <div class="log-title" id="logTitle">きょうのログ</div>
  <div id="logList"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <h2 id="sheetTitle">なんのために降りた？</h2>
    <div class="sheet-sub" id="sheetSub"></div>
    <div class="chips" id="chips"></div>
    <textarea id="sheetInput" rows="2" placeholder="内容を入力…"></textarea>
    <div class="sheet-actions">
      <button class="btn-cancel" id="sheetCancel">キャンセル</button>
      <button class="btn-save" id="sheetSave">記録する</button>
    </div>
  </div>
</div>

<div class="overlay" id="statsOverlay">
  <div class="sheet stats-sheet" id="statsSheet">
    <h2>振り返り</h2>
    <div class="sheet-sub">ここまでの積み重ね、見てみよか</div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="streak-line" id="streakLine"></div>
    <div class="bar-title">直近14日間</div>
    <div class="bar-chart" id="barChart"></div>
    <div class="bar-title" id="topPurposeTitle" style="display:none;">よく行く目的 TOP3</div>
    <div id="topPurposeList"></div>
    <div class="sheet-actions" style="margin-top:20px;">
      <button class="btn-cancel" id="statsClose" style="flex:1;">閉じる</button>
    </div>
    <div style="text-align:center; margin-top:10px;">
      <a class="small-link" href="shortcut.html">⌚ ショートカット用コピー集</a>
      <span style="color:var(--line);">｜</span>
      <button class="small-link" id="changeKeyBtn">合言葉を入れ直す</button>
    </div>
  </div>
</div>

<div class="overlay" id="keyOverlay">
  <div class="sheet">
    <h2>合言葉を入れてな</h2>
    <div class="sheet-sub">クラウドの記録を開くための合言葉や。この端末に覚えとくから、最初の1回だけでええで。</div>
    <input type="text" id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉">
    <div class="sheet-actions">
      <button class="btn-save" id="keySave">はじめる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import {
  initializeFirestore, persistentLocalCache, memoryLocalCache,
  collection, doc, setDoc, writeBatch, onSnapshot,
  query, where, getDocs, getCountFromServer
} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

// firebaseConfig は公開前提の値。実際の守りは Firestore ルール(合言葉パス)で行う
const firebaseConfig = {
  apiKey: 'AIzaSyDm_v6dwxbIUf4xwhmGb_P9YdlaJgA_3Qs',
  authDomain: 'pochilog-fujita.firebaseapp.com',
  projectId: 'pochilog-fujita',
  storageBucket: 'pochilog-fujita.firebasestorage.app',
  messagingSenderId: '523790629146',
  appId: '1:523790629146:web:41d50718dd37786d4cd4a3'
};
const WINDOW_DAYS = 40; // 常時読み込むのは直近40日分(無料枠の読み取り回数を節約)

const app = initializeApp(firebaseConfig);
let db;
try {
  // オフラインでも端末内に保存しておき、電波が戻ったら自動で送る
  db = initializeFirestore(app, { localCache: persistentLocalCache() });
} catch(e){
  db = initializeFirestore(app, { localCache: memoryLocalCache() });
}

const $ = (id) => document.getElementById(id);
let entries = [];          // 直近 WINDOW_DAYS 日分
const olderByDay = {};     // それより前の日は表示時に都度読み込む
let activeTrip = null;
let loaded = false;
let viewDate = new Date();
let sheetMode = null; // 'drive-end' | 'note'
let timerInterval = null;
let KEY = null, entriesCol = null, activeRef = null;
let totalCount = null;

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function timeLabel(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDateLabel(d){
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  const today = dateKey(d) === dateKey(new Date());
  return `${d.getMonth()+1}/${d.getDate()}(${w})${today ? ' 今日' : ''}`;
}
function fmtDuration(ms){
  const min = Math.round(ms/60000);
  if (min < 60) return `${min}分`;
  return `${Math.floor(min/60)}時間${min%60}分`;
}
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}
function windowStartKey(){
  const d = new Date(); d.setDate(d.getDate() - WINDOW_DAYS);
  return dateKey(d);
}
function saveFailed(e){
  console.error(e);
  showToast('保存に失敗したで…合言葉を確認してな');
}

// ---------- 合言葉 ----------
function readKey(){
  const m = location.hash.match(/k=([0-9a-z]+)/);
  if (m){
    try { localStorage.setItem('pochilog_key', m[1]); } catch(e){}
    history.replaceState(null, '', location.pathname + location.search);
    return m[1];
  }
  try { return localStorage.getItem('pochilog_key'); } catch(e){ return null; }
}
function askKey(){
  $('keyInput').value = '';
  $('keyOverlay').classList.add('open');
}
$('keySave').addEventListener('click', ()=>{
  const v = $('keyInput').value.trim();
  if (!v){ showToast('合言葉を入れてな'); return; }
  try { localStorage.setItem('pochilog_key', v); } catch(e){}
  location.reload();
});
$('changeKeyBtn').addEventListener('click', ()=>{
  $('statsOverlay').classList.remove('open');
  askKey();
});

// ---------- 読み込み(リアルタイム同期) ----------
function start(){
  entriesCol = collection(db, 'p', KEY, 'entries');
  activeRef = doc(db, 'p', KEY, 'state', 'active');

  onSnapshot(query(entriesCol, where('day', '>=', windowStartKey())), { includeMetadataChanges: true }, snap => {
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded = true;
    $('syncStatus').textContent = snap.metadata.hasPendingWrites ? '☁ 未送信あり' : (snap.metadata.fromCache ? 'オフライン' : '');
    render();
  }, err => {
    console.error(err);
    loaded = true;
    render();
    showToast('読み込めへんかった…合言葉を確認してな');
  });

  onSnapshot(activeRef, snap => {
    activeTrip = snap.exists() ? snap.data() : null;
    updateDriveButton();
  }, err => console.error(err));

  render();
  checkMigration();
}

async function loadOlderDay(key){
  if (olderByDay[key]) return;
  olderByDay[key] = [];
  try {
    const snap = await getDocs(query(entriesCol, where('day', '==', key)));
    olderByDay[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e){ delete olderByDay[key]; console.error(e); }
  if (dateKey(viewDate) === key) render();
}

function effectiveTime(e){
  // 車移動は「到着した時刻」、それ以外は記録した時刻を代表時刻として扱う
  return e.type === 'drive' ? (e.endTime || e.startTime) : e.startTime;
}
function dayOf(e){ return dateKey(new Date(effectiveTime(e))); }

function entriesForDate(d){
  const key = dateKey(d);
  const src = key >= windowStartKey() ? entries : (olderByDay[key] || []);
  if (key < windowStartKey()) loadOlderDay(key);
  return src
    .filter(e => dayOf(e) === key)
    .sort((a,b)=> new Date(effectiveTime(b)) - new Date(effectiveTime(a)));
}

function render(){
  $('dateLabel').textContent = fmtDateLabel(viewDate);
  const today = dateKey(viewDate) === dateKey(new Date());
  $('logTitle').textContent = today ? 'きょうのログ' : `${viewDate.getMonth()+1}/${viewDate.getDate()}のログ`;

  const list = entriesForDate(viewDate);
  const driveMs = list
    .filter(e => e.type === 'drive' && e.endTime)
    .reduce((sum,e)=> sum + (new Date(e.endTime) - new Date(e.startTime)), 0);
  const driveCount = list.filter(e=>e.type==='drive').length;
  $('summary').innerHTML = list.length
    ? `記録 <b>${list.length}</b>件・移動 <b>${driveCount}</b>回・合計移動 <b>${driveMs? fmtDuration(driveMs) : '0分'}</b>`
    : '';

  const box = $('logList');
  if (!loaded){
    box.innerHTML = `<div class="empty">読み込み中…</div>`;
    return;
  }
  if (list.length === 0){
    box.innerHTML = `<div class="empty">まだ記録がないで。<br>下のボタンをポチッと押してな。</div>`;
    return;
  }
  box.innerHTML = list.map(e => {
    const t = timeLabel(new Date(effectiveTime(e)));
    if (e.type === 'drive'){
      const dur = e.endTime ? fmtDuration(new Date(e.endTime)-new Date(e.startTime)) : '移動中…';
      return `
        <div class="entry drive">
          <div class="time">${t}</div>
          <div class="icon">🚗</div>
          <div class="body">
            <div class="main-text">${escapeHtml(e.purpose || '(目的未記入)')}</div>
            <div class="sub-text">移動 ${dur}</div>
          </div>
          <button class="del" data-id="${escapeHtml(e.id)}">✕</button>
        </div>`;
    }
    return `
      <div class="entry">
        <div class="time">${t}</div>
        <div class="icon">📍</div>
        <div class="body">
          <div class="main-text">${escapeHtml(e.text)}</div>
        </div>
        <button class="del" data-id="${escapeHtml(e.id)}">✕</button>
      </div>`;
  }).join('');

  box.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteEntry(btn.dataset.id));
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function deleteEntry(id){
  // 画面は Firestore の変更通知で自動更新される(オフラインでも即反映)
  const batch = writeBatch(db);
  batch.delete(doc(entriesCol, id));
  batch.commit().catch(saveFailed);
  Object.keys(olderByDay).forEach(k => { olderByDay[k] = olderByDay[k].filter(e => e.id !== id); });
  render();
}

function updateDriveButton(){
  const btn = $('driveBtn');
  const label = $('driveBtnLabel');
  if (activeTrip){
    btn.classList.add('running');
    tickTimer();
    if (!timerInterval) timerInterval = setInterval(tickTimer, 1000);
  } else {
    btn.classList.remove('running');
    label.textContent = '🚗 出発する';
    if (timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }
}
function tickTimer(){
  if (!activeTrip) return;
  const ms = Math.max(0, Date.now() - new Date(activeTrip.startTime).getTime());
  const min = Math.floor(ms/60000);
  const sec = Math.floor((ms%60000)/1000);
  $('driveBtnLabel').textContent = `🚗 移動中 ${pad(min)}:${pad(sec)}（タップで到着）`;
}

function commonPurposes(type){
  const counts = {};
  entries.filter(e => type === 'drive' ? e.type==='drive' : e.type==='note').forEach(e=>{
    const v = type === 'drive' ? e.purpose : e.text;
    if (v) counts[v] = (counts[v]||0) + 1;
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
}

function openSheet(mode){
  sheetMode = mode;
  const sheet = $('sheet');
  const chipsBox = $('chips');
  $('sheetInput').value = '';
  if (mode === 'drive-end'){
    sheet.classList.remove('record-mode');
    $('sheetTitle').textContent = 'なんのために降りた？';
    $('sheetSub').textContent = '目的を入れて記録するで';
    $('sheetInput').placeholder = '例）戸田さん宅へ送迎';
    chipsBox.innerHTML = commonPurposes('drive').map(p=>`<div class="chip" data-v="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('');
  } else {
    sheet.classList.add('record-mode');
    $('sheetTitle').textContent = 'なにした？';
    $('sheetSub').textContent = `${timeLabel(new Date())}の記録として残すで`;
    $('sheetInput').placeholder = '例）新神野で買い出し';
    chipsBox.innerHTML = commonPurposes('note').map(p=>`<div class="chip" data-v="${escapeHtml(p)}">${escapeHtml(p)}</div>`).join('');
  }
  chipsBox.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{ $('sheetInput').value = c.dataset.v; });
  });
  $('overlay').classList.add('open');
  setTimeout(()=> $('sheetInput').focus(), 150);
}
function closeSheet(){
  $('overlay').classList.remove('open');
  sheetMode = null;
}

// 書き込みは await しない: 電波が悪くても端末内に即保存され、つながったら自動で送られる
function handleDriveBtn(){
  if (!activeTrip){
    const startTime = new Date().toISOString();
    activeTrip = { startTime };
    setDoc(activeRef, { startTime }).catch(saveFailed);
    updateDriveButton();
    showToast('移動を記録開始');
  } else {
    openSheet('drive-end');
  }
}

function handleSheetSave(){
  const val = $('sheetInput').value.trim();
  if (!val){ showToast('内容を入れてな'); return; }
  if (sheetMode === 'drive-end'){
    if (!activeTrip){ closeSheet(); return; }
    const endTime = new Date().toISOString();
    const entry = {
      type: 'drive',
      startTime: activeTrip.startTime,
      endTime,
      purpose: val,
      day: dateKey(new Date(endTime))
    };
    const batch = writeBatch(db);
    batch.set(doc(entriesCol, 'd' + Date.now()), entry);
    batch.delete(activeRef);
    batch.commit().catch(saveFailed);
    activeTrip = null;
    updateDriveButton();
    showToast('到着を記録したで');
  } else {
    const startTime = new Date().toISOString();
    setDoc(doc(entriesCol, 'n' + Date.now()), {
      type: 'note', startTime, text: val, day: dateKey(new Date(startTime))
    }).catch(saveFailed);
    showToast('記録したで');
  }
  closeSheet();
  render();
}

$('driveBtn').addEventListener('click', handleDriveBtn);
$('recordBtn').addEventListener('click', ()=> openSheet('note'));
$('sheetCancel').addEventListener('click', closeSheet);
$('sheetSave').addEventListener('click', handleSheetSave);
$('overlay').addEventListener('click', (e)=>{ if (e.target.id === 'overlay') closeSheet(); });

$('prevDay').addEventListener('click', ()=>{ viewDate.setDate(viewDate.getDate()-1); render(); });
$('nextDay').addEventListener('click', ()=>{ viewDate.setDate(viewDate.getDate()+1); render(); });

// ---------- 振り返り ----------
function computeStats(){
  const byDate = {};
  entries.forEach(e=>{
    const k = dayOf(e);
    byDate[k] = (byDate[k]||0) + 1;
  });
  const total = totalCount ?? entries.length;

  let streak = 0;
  let cur = new Date();
  while (byDate[dateKey(cur)]) {
    streak++;
    cur.setDate(cur.getDate()-1);
  }

  let weekCount = 0;
  for (let i=0;i<7;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    weekCount += byDate[dateKey(d)] || 0;
  }

  const now = new Date();
  const monthKey = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const monthDriveMs = entries
    .filter(e=> e.type==='drive' && e.endTime && dayOf(e).startsWith(monthKey))
    .reduce((s,e)=> s + (new Date(e.endTime)-new Date(e.startTime)), 0);

  const last14 = [];
  for (let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    last14.push({ date: d, count: byDate[dateKey(d)] || 0 });
  }

  const pCounts = {};
  entries.forEach(e=>{
    const v = e.type==='drive' ? e.purpose : e.text;
    if (v) pCounts[v] = (pCounts[v]||0)+1;
  });
  const topPurposes = Object.entries(pCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);

  return { total, streak, weekCount, monthDriveMs, last14, topPurposes };
}

function renderStats(){
  const s = computeStats();
  $('statGrid').innerHTML = `
    <div class="stat-card"><div class="num">${s.total}</div><div class="label">通算記録数</div></div>
    <div class="stat-card"><div class="num">${s.weekCount}</div><div class="label">直近7日間</div></div>
    <div class="stat-card"><div class="num">${s.monthDriveMs ? fmtDuration(s.monthDriveMs) : '0分'}</div><div class="label">今月の移動時間</div></div>
    <div class="stat-card"><div class="num">${s.streak}</div><div class="label">連続記録日数</div></div>
  `;
  $('streakLine').textContent = s.streak >= 2 ? `🔥 ${s.streak}日連続で記録できてるで、ええ調子や` : '';

  const max = Math.max(1, ...s.last14.map(d=>d.count));
  $('barChart').innerHTML = s.last14.map(d=>{
    const h = Math.round((d.count / max) * 100) || 3;
    const isToday = dateKey(d.date) === dateKey(new Date());
    const w = ['日','月','火','水','木','金','土'][d.date.getDay()];
    return `<div class="bar-col">
      <div class="bar-fill${isToday?' today':''}" style="height:${h}%"></div>
      <div class="bar-label">${w}</div>
    </div>`;
  }).join('');

  const topBox = $('topPurposeList');
  const topTitle = $('topPurposeTitle');
  if (s.topPurposes.length){
    topTitle.style.display = 'block';
    topBox.innerHTML = s.topPurposes.map(([name,cnt])=>`
      <div class="purpose-row"><span>${escapeHtml(name)}</span><span class="cnt">${cnt}回</span></div>
    `).join('');
  } else {
    topTitle.style.display = 'none';
    topBox.innerHTML = '';
  }
}

$('statsBtn').addEventListener('click', ()=>{
  renderStats();
  $('statsOverlay').classList.add('open');
  // 通算件数はサーバーで数える(読み取り1回分で済む)。オフラインなら手元の件数のまま
  if (entriesCol) getCountFromServer(entriesCol).then(r=>{
    totalCount = r.data().count;
    if ($('statsOverlay').classList.contains('open')) renderStats();
  }).catch(()=>{});
});
$('statsClose').addEventListener('click', ()=> $('statsOverlay').classList.remove('open'));
$('statsOverlay').addEventListener('click', (e)=>{ if(e.target.id==='statsOverlay') $('statsOverlay').classList.remove('open'); });

// ---------- 前のバージョン(この端末のlocalStorage)からの移行 ----------
function readLocal(){
  try {
    const raw = localStorage.getItem('jikoroku_entries');
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch(e){ return []; }
}
function readLocalTrip(){
  try { return JSON.parse(localStorage.getItem('jikoroku_activeTrip') || 'null'); } catch(e){ return null; }
}
function checkMigration(){
  let done = false;
  try { done = localStorage.getItem('pochilog_migrated') === '1'; } catch(e){}
  const list = readLocal();
  if (done || !list.length){ $('migrateBox').style.display = 'none'; return; }
  $('migrateText').innerHTML = `この端末に前の記録が <b>${list.length}</b>件 残ってるで。<br>念のためバックアップを保存してから、クラウドに移してな。`;
  $('migrateBox').style.display = 'block';
}
function toCloudEntry(e){
  const type = e.type === 'drive' ? 'drive' : 'note';
  const startTime = String(e.startTime || '');
  if (startTime.length < 10) return null;
  if (type === 'drive'){
    const endTime = String(e.endTime || startTime);
    return { type, startTime, endTime, purpose: String(e.purpose || '').slice(0,200), day: dateKey(new Date(endTime)) };
  }
  const text = String(e.text || '').slice(0,500);
  if (!text) return null;
  return { type, startTime, text, day: dateKey(new Date(startTime)) };
}
$('backupBtn').addEventListener('click', ()=>{
  const data = { exportedAt: new Date().toISOString(), entries: readLocal(), activeTrip: readLocalTrip() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pochilog-backup-${dateKey(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('バックアップを保存したで');
});
$('migrateBtn').addEventListener('click', async ()=>{
  const list = readLocal();
  const btn = $('migrateBtn');
  btn.disabled = true; btn.textContent = '移してるで…';
  // 元のIDをそのまま使うので、何回押しても重複せえへん
  const jobs = [];
  let batch = writeBatch(db), n = 0, count = 0;
  for (const e of list){
    const data = toCloudEntry(e);
    if (!data) continue;
    const prefix = data.type === 'drive' ? 'd' : 'n';
    let id = String(e.id || '');
    if (!/^[dn][0-9A-Za-z_-]{1,40}$/.test(id)) id = prefix + new Date(data.startTime).getTime();
    batch.set(doc(entriesCol, id), data);
    count++;
    if (++n >= 400){ jobs.push(batch.commit()); batch = writeBatch(db); n = 0; }
  }
  const trip = readLocalTrip();
  if (trip && trip.startTime && !activeTrip) batch.set(activeRef, { startTime: String(trip.startTime) });
  jobs.push(batch.commit());
  try {
    await Promise.all(jobs);
    try { localStorage.setItem('pochilog_migrated', '1'); } catch(e){}
    $('migrateBox').style.display = 'none';
    showToast(`${count}件 クラウドに移したで`);
  } catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = '☁ クラウドに移す';
    showToast('移せへんかった…電波のええとこでもう一回押してな');
  }
});

// ---------- 起動 ----------
KEY = readKey();
if (KEY) start(); else { loaded = true; render(); askKey(); }
</script>
